# Netlify: builds the Angular app on every push to main and serves it as a single-page app.
[build]
  command = "npm run build"
  publish = "dist/nestly/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular handles routing in the browser — any path (e.g. /rent/flat/ff-2611-001) must load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed JS/CSS files never change, so browsers can cache them for a year; index.html is always re-checked.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
